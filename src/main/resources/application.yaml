spring:
  application:
    name: kaffehausv4
  datasource:
    url: jdbc:postgresql://localhost:5432/kaffehausdb
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${SERVER_PORT:8081}

seguridad:
  jwt:
    secreto-acceso: ${JWT_SECRET:desarrollo-kaffehaus-secreto-de-acceso-cambiar-en-produccion}
    secreto-refresco: ${JWT_REFRESH_SECRET:desarrollo-kaffehaus-secreto-de-refresco-cambiar-en-produccion}
    emisor: ${JWT_ISSUER:kaffehausv4}
    # Vigencias fijadas por especificacion: 15 minutos y 7 dias.
    minutos-de-acceso: ${JWT_ACCESS_MINUTES:15}
    dias-de-refresco: ${JWT_REFRESH_DAYS:7}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  # POST /api/v1/seed publico para el primer arranque. En false solo lo llama un Administrador.
  seed-habilitado: ${SEED_HABILITADO:true}
