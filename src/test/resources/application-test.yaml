# Perfil de las pruebas de persistencia: H2 en memoria en modo PostgreSQL (arquitectura.md 6.5).
# Hibernate crea el esquema desde las entidades; despues se ejecuta h2/esquema-postgresql.sql
# con lo que el esquema real tiene fuera de las entidades (la secuencia del ticket).
spring:
  datasource:
    url: jdbc:h2:mem:kaffehausdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      # Sintaxis de H2 para la espera maxima de un bloqueo (la de PostgreSQL esta en application.yaml).
      connection-init-sql: SET LOCK_TIMEOUT 5000
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: always
      schema-locations: classpath:h2/esquema-postgresql.sql

server:
  port: 0

# Valores fijos de prueba: application.yaml los exige del entorno y las pruebas no dependen del .env.
seguridad:
  jwt:
    secreto-acceso: secreto-de-acceso-solo-para-pruebas-0123456789
    secreto-refresco: secreto-de-refresco-solo-para-pruebas-0123456789
    emisor: kaffehausv4-pruebas
    minutos-de-acceso: 15
    dias-de-refresco: 7
  cors:
    origenes-permitidos: http://localhost:[*]
  # Contrasena del administrador que siembra EscenarioDeCafeteria (logica.md SIEMBRA-02).
  seed-admin-contrasena: admin-de-prueba
