# Perfil de las pruebas de persistencia: H2 en memoria en modo PostgreSQL (arquitectura.md 6.5).
# Hibernate crea el esquema desde las entidades; despues se ejecuta h2/esquema-postgresql.sql
# con lo que el esquema real tiene fuera de las entidades (la secuencia del ticket).
spring:
  datasource:
    url: jdbc:h2:mem:kaffehausdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: always
      schema-locations: classpath:h2/esquema-postgresql.sql
