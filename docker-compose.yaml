services:
  kaffehausdb:
    image: postgres:16-alpine
    container_name: kaffehausdb
    restart: unless-stopped
    environment:
      POSTGRES_DB: kaffehausdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - kaffehaus_postgres_data:/var/lib/postgresql/data
    networks:
      - kaffehaus_net

volumes:
  kaffehaus_postgres_data:
    driver: local

networks:
  kaffehaus_net:
    driver: bridge